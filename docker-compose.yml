services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: UniMate
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env}
      APP_URL: ${APP_URL:?Set APP_URL in the root .env}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: unimate
      DB_USERNAME: ${DB_USERNAME:-s20230204011}
      DB_PASSWORD: ${MYSQL_USER_PASSWORD:?Set MYSQL_USER_PASSWORD}
      SESSION_DRIVER: file
      SESSION_DOMAIN: null
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-${APP_URL}/api/auth/google/callback}
      GOOGLE_FRONTEND_URL: ${APP_URL}
    depends_on:
      - mysql
    volumes:
      - uploads:/var/www/storage/app/public
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      - backend
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: unimate
      MYSQL_USER: ${DB_USERNAME:-s20230204011}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:?Set MYSQL_USER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D unimate -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  mysql_data:
  uploads:
