services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unimate_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - mysql
    environment:
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: unimate
      DB_USERNAME: s20230204011
      DB_PASSWORD: ${MYSQL_USER_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://s20230204011.austattendance.online
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unimate_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: unimate_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_DATABASE: unimate
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
